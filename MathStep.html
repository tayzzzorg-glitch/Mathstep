<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MathStep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ec;--card:#ffffff;--ink:#1f2a44;--mute:#5d6783;--line:#e6dcc8;--main:#2d5bff;--mainInk:#fff;--ok:#12805c;--okBg:#dff5ea;--bad:#b3261e;--badBg:#fde4e2;--gold:#ffb703;--chip:#eef1ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#11172b;--card:#1b2440;--ink:#eef1ff;--mute:#a7b0cc;--line:#2f3a5e;--main:#7c9bff;--mainInk:#0e1530;--ok:#5fd6a4;--okBg:#173a2f;--bad:#ff9b94;--badBg:#43201f;--chip:#262f52}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#11172b;--card:#1b2440;--ink:#eef1ff;--mute:#a7b0cc;--line:#2f3a5e;--main:#7c9bff;--mainInk:#0e1530;--ok:#5fd6a4;--okBg:#173a2f;--bad:#ff9b94;--badBg:#43201f;--chip:#262f52}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.7 "Prompt","Sarabun",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:2rem;margin:0;font-weight:700;letter-spacing:-.5px}
h2{font-size:1.2rem;margin:20px 0 8px}
p{margin:6px 0}.mute{color:var(--mute);font-size:.92rem}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.score{background:var(--gold);color:#3b2a00;border-radius:14px;padding:6px 14px;font-weight:700;text-align:center;line-height:1.3}
.score small{display:block;font-weight:500;font-size:.75rem}
.tabs{display:flex;gap:8px;margin:18px 0 12px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 16px;min-height:48px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.tab.on{background:var(--main);color:var(--mainInk);border-color:var(--main);font-weight:500}
.item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;margin-bottom:10px;gap:10px}
.chip{background:var(--chip);border-radius:20px;padding:2px 10px;font-size:.8rem;white-space:nowrap}
.done{color:var(--ok);font-weight:500;white-space:nowrap}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.q{font-size:1.1rem;font-weight:500}
.bar{display:flex;gap:6px;margin:6px 0 14px}
.bar div{flex:1;text-align:center;font-size:.72rem;color:var(--mute);border-top:6px solid var(--line);padding-top:4px}
.bar .on{border-color:var(--main);color:var(--ink);font-weight:500}
.bar .past{border-color:var(--ok)}
.opt{display:block;width:100%;text-align:left;margin:8px 0}
.opt.ok{background:var(--okBg);border-color:var(--ok)}
.opt.bad{background:var(--badBg);border-color:var(--bad)}
.go{background:var(--main);color:var(--mainInk);border-color:var(--main);font-weight:500;width:100%;margin-top:12px}
.go[disabled]{opacity:.4;cursor:not-allowed}
input,select{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);min-height:48px}
.msg{border-radius:14px;padding:12px 14px;margin:10px 0}
.msg.ok{background:var(--okBg);color:var(--ok)}.msg.bad{background:var(--badBg);color:var(--bad)}.msg.tip{background:var(--chip)}
ol{padding-left:22px;margin:8px 0}
.link{border:none;background:none;color:var(--main);padding:8px 0;min-height:0;text-decoration:underline}
</style>
</head>
<body>
<main id="app"></main>
<script>
// ====== คลังโจทย์: เพิ่ม/แก้ไขได้ที่นี่ ======
// g = โจทย์ให้อะไร, a = โจทย์ถามอะไร, m = วิธีคิด (ข้อแรกในแต่ละชุดคือข้อที่ถูก)
const P=[
{lv:"ง่าย",tp:"เซต",q:"กำหนด A = {1, 2, 3, 4, 5} และ B = {4, 5, 6, 7} จงหาจำนวนสมาชิกของ A ∪ B",
 g:["A = {1,2,3,4,5} และ B = {4,5,6,7}","A = {4,5} และ B = {6,7}","มีสมาชิกรวม 7 ตัว"],
 a:["จำนวนสมาชิกของ A ∪ B","สมาชิกร่วมของ A และ B","ผลต่างของ A และ B"],
 m:["รวมสมาชิกของ A และ B แต่นับตัวที่ซ้ำครั้งเดียว","รวมจำนวนสมาชิกของ A กับ B ตรง ๆ โดยไม่ตัดตัวซ้ำ","เอาเฉพาะสมาชิกที่อยู่ทั้งสองเซต"],
 ans:["7"],hint:"A ∪ B คือการนำสมาชิกทั้งหมดมารวมกัน ตัวที่ซ้ำกัน (4 และ 5) นับครั้งเดียว",
 sol:["A ∪ B = {1, 2, 3, 4, 5, 6, 7}","นับสมาชิกได้ 7 ตัว","ตอบ 7"]},
{lv:"ง่าย",tp:"ตรรกศาสตร์",q:"ให้ p เป็นจริง และ q เป็นเท็จ จงหาค่าความจริงของ p ∧ q (ตอบ 1 แทนจริง และ 0 แทนเท็จ)",
 g:["p เป็นจริง, q เป็นเท็จ","p และ q เป็นจริงทั้งคู่","p เป็นเท็จ, q เป็นจริง"],
 a:["ค่าความจริงของ p ∧ q","ค่าความจริงของ p ∨ q","ค่าความจริงของ ~p"],
 m:["∧ (และ) จะจริงเมื่อจริงทั้งสองตัว","∧ จะจริงเมื่อมีตัวใดตัวหนึ่งจริง","∧ จะเท็จเมื่อทั้งสองตัวเป็นเท็จเท่านั้น"],
 ans:["0"],hint:"ตัวเชื่อม “และ” ต้องจริงทั้งคู่ถึงจะจริง ลองดูว่า q เป็นอะไร",
 sol:["p ∧ q = จริง ∧ เท็จ","∧ จะจริงเมื่อทั้งสองจริงเท่านั้น","ผลเป็นเท็จ ตอบ 0"]},
{lv:"กลาง",tp:"เซต",q:"นักเรียน 40 คน ชอบฟุตบอล 25 คน ชอบบาสเกตบอล 20 คน และชอบทั้งสองอย่าง 8 คน มีนักเรียนกี่คนที่ไม่ชอบทั้งสองอย่าง",
 g:["ทั้งหมด 40, ฟุตบอล 25, บาส 20, ทั้งสอง 8","ทั้งหมด 40, ฟุตบอลอย่างเดียว 25, บาสอย่างเดียว 20","ทั้งหมด 40 และไม่ชอบทั้งสอง 8"],
 a:["จำนวนคนที่ไม่ชอบทั้งสองอย่าง","จำนวนคนที่ชอบทั้งสองอย่าง","จำนวนคนที่ชอบฟุตบอลอย่างเดียว"],
 m:["หาจำนวนคนที่ชอบอย่างน้อยหนึ่งอย่างด้วย n(A)+n(B)−n(A∩B) แล้วเอาไปลบจาก 40","เอา 25+20+8 แล้วลบจาก 40","เอา 40 ลบ 25 แล้วลบ 20"],

 sol:["n(A∪B) = 25 + 20 − 8 = 37","คนที่ชอบอย่างน้อยหนึ่งอย่างมี 37 คน","ไม่ชอบทั้งสอง = 40 − 37 = 3 คน"]},
{lv:"กลาง",tp:"ตรรกศาสตร์",q:"ให้ p จริง, q เท็จ, r จริง จงหาค่าความจริงของ (p → q) ∨ r (ตอบ 1 แทนจริง และ 0 แทนเท็จ)",
 g:["p จริง, q เท็จ, r จริง","p จริง, q จริง, r เท็จ","p เท็จ, q เท็จ, r เท็จ"],

 m:["หาค่าในวงเล็บ p → q ก่อน แล้วค่อยนำไป ∨ กับ r","หา q ∨ r ก่อน แล้วค่อย → กับ p","ใช้ค่า r อย่างเดียวได้เลย"],

 sol:["p → q = จริง → เท็จ = เท็จ","(p → q) ∨ r = เท็จ ∨ จริง","∨ จริงเมื่อมีตัวใดตัวหนึ่งจริง ตอบ 1"]},
{lv:"ยาก",tp:"เซต",q:"นักเรียน 50 คน เรียนคณิตศาสตร์ 30 คน เรียนวิทยาศาสตร์ 28 คน และไม่เรียนทั้งสองวิชา 5 คน มีนักเรียนกี่คนที่เรียนเฉพาะคณิตศาสตร์",
 g:["ทั้งหมด 50, คณิต 30, วิทย์ 28, ไม่เรียนทั้งสอง 5","ทั้งหมด 50, เรียนทั้งสองวิชา 5","ทั้งหมด 50, เฉพาะคณิต 30, เฉพาะวิทย์ 28"],
 a:["จำนวนคนที่เรียนเฉพาะคณิตศาสตร์","จำนวนคนที่เรียนวิทยาศาสตร์","จำนวนคนที่เรียนคณิตหรือวิทย์"],
 m:["หา n(A∪B) = 50−5 ก่อน แล้วหาส่วนที่เรียนทั้งสอง จากนั้นลบออกจากคณิต","เอา 30 − 5","เอา 50 − 28"],

 sol:["n(A∪B) = 50 − 5 = 45","45 = 30 + 28 − n(A∩B) ได้ n(A∩B) = 13","เรียนเฉพาะคณิต = 30 − 13 = 17 คน"]},
{lv:"ยาก",tp:"ตรรกศาสตร์",q:"ในตารางค่าความจริงของ (p ∨ q) ∧ ~p มีทั้งหมด 4 แถว จงหาว่ามีกี่แถวที่ได้ผลเป็นจริง",
 g:["รูปแบบประพจน์ (p ∨ q) ∧ ~p และตาราง 4 แถว","p และ q จริงทั้งคู่","รูปแบบประพจน์ p ∨ (q ∧ ~p)"],
 a:["จำนวนแถวที่ผลเป็นจริง","จำนวนแถวที่ผลเป็นเท็จ","ค่าความจริงของแถวแรก"],
 m:["เขียนตารางทุกกรณีของ p, q แล้วหาค่า (p ∨ q) และ ~p ทีละแถว","ดูแค่แถวที่ p จริง","ตอบจากจำนวนแถวทั้งหมดหารสอง"],
 ans:["1"],hint:"ผลจะจริงได้ต้อง ~p จริง (p เท็จ) และ p ∨ q ต้องจริงด้วย ลองดูว่า q ต้องเป็นอะไร",
 sol:["แถว (จ,จ): (จ)∧(ท) = ท","แถว (จ,ท): (จ)∧(ท) = ท","แถว (ท,จ): (จ)∧(จ) = จ","แถว (ท,ท): (ท)∧(จ) = ท","มี 1 แถวที่เป็นจริง"]}
];

const G=["ม.1","ม.2","ม.3","ม.4","ม.5","ม.6"];

const CH={"ม.1":["จำนวนเต็ม","ทศนิยมและเศษส่วน","เลขยกกำลัง","การสร้างพื้นฐานทางเรขาคณิต","สมการเชิงเส้นตัวแปรเดียว","อัตราส่วนและร้อยละ"],
"ม.2":["จำนวนจริง","ทฤษฎีบทพีทาโกรัส","พหุนาม","ความเท่ากันทุกประการ","ปริซึมและทรงกระบอก"],
"ม.3":["ฟังก์ชันกำลังสอง","ความคล้าย","วงกลม","อสมการเชิงเส้นตัวแปรเดียว"],
"ม.4":["เซต","ตรรกศาสตร์","จำนวนจริง","ฟังก์ชัน"],
"ม.5":["ตรีโกณมิติ","ลำดับและอนุกรม","เลขยกกำลังและลอการิทึม"],

P.push(
{gr:"ม.1",lv:"ง่าย",tp:"จำนวนเต็ม",q:"จงหาค่าของ (−8) + 15 − 4",
 g:["มีเลข −8, 15 และ 4 บวกลบกัน","มีเลข 8, 15 และ 4 คูณกัน","มีเลขสองตัวคือ −8 และ 15"],

 m:["คิดจากซ้ายไปขวาทีละคู่","ลบก่อนแล้วค่อยบวก","ตัดเครื่องหมายลบทิ้งทุกจำนวน"],
 ans:["3"],hint:"เริ่มจาก (−8) + 15 ก่อน แล้วค่อยลบ 4",sol:["(−8) + 15 = 7","7 − 4 = 3","ตอบ 3"]},
{gr:"ม.1",lv:"กลาง",tp:"สมการเชิงเส้นตัวแปรเดียว",q:"จงแก้สมการ 3x + 5 = 20 แล้วหาค่า x",

{gr:"ม.2",lv:"กลาง",tp:"ทฤษฎีบทพีทาโกรัส",q:"สามเหลี่ยมมุมฉากมีด้านประกอบมุมฉากยาว 6 และ 8 หน่วย จงหาความยาวด้านตรงข้ามมุมฉาก",
 g:["ด้านประกอบมุมฉากยาว 6 และ 8","ด้านตรงข้ามมุมฉากยาว 6","ด้านทั้งสามยาว 6, 8 และ 10"],

 m:["ใช้ a² + b² = c² แล้วถอดรากที่สอง","บวก 6 กับ 8 ได้เลย","คูณ 6 กับ 8"],

{gr:"ม.3",lv:"ง่าย",tp:"ฟังก์ชันกำลังสอง",q:"กำหนด f(x) = x² − 4x + 3 จงหาค่า f(5)",
 g:["f(x) = x² − 4x + 3 และ x = 5","f(5) = 3","x² = 4x"],
 a:["ค่าของ f เมื่อ x = 5","ค่า x ที่ทำให้ f(x) = 0","จุดยอดของกราฟ"],
 m:["แทน x ด้วย 5 ในฟังก์ชันแล้วคำนวณ","แยกตัวประกอบแล้วหาราก","หาค่า x ที่ทำให้ f(x) เป็นศูนย์"],
 ans:["8"],hint:"แทน x = 5 ได้ 5² − 4(5) + 3",sol:["f(5) = 25 − 20 + 3","= 8","ตอบ 8"]},
{gr:"ม.5",lv:"กลาง",tp:"ลำดับและอนุกรม",q:"ลำดับเลขคณิตมีพจน์แรก 3 และผลต่างร่วม 4 จงหาพจน์ที่ 10",

 ans:["39"],hint:"แทน n = 10 ในสูตร จะได้ 3 + 9 × 4",sol:["a₁₀ = 3 + (10 − 1)(4)","= 3 + 36","ตอบ 39"]},
{gr:"ม.6",lv:"ง่าย",tp:"ความน่าจะเป็น",q:"ถุงมีลูกบอลสีแดง 3 ลูก สีน้ำเงิน 2 ลูก หยิบ 1 ลูก ความน่าจะเป็นที่ได้สีแดงเป็นเท่าใด (ตอบเป็นเศษส่วน เช่น 1/2)",
 g:["แดง 3 ลูก น้ำเงิน 2 ลูก","แดง 2 ลูก น้ำเงิน 3 ลูก","หยิบ 2 ลูก"],
 a:["P(ได้สีแดง)","P(ได้สีน้ำเงิน)","จำนวนลูกบอลทั้งหมด"],

// สลับลำดับแบบ Fisher-Yates (สุ่มสม่ำเสมอ)
const shuf=a=>{const r=a.map((t,i)=>({t,ok:i===0}));for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r};
// แปลงเลขไทย และเครื่องหมายลบทุกแบบ (− – —) ให้เป็น - ก่อนตรวจ
const norm=s=>s.replace(/\s/g,"").replace(/[๐-๙]/g,d=>"๐๑๒๓๔๕๖๗๘๙".indexOf(d)).replace(/[−–—]/g,"-").toLowerCase();
const total=()=>Object.values(pts).reduce((a,b)=>a+b,0);
const done=()=>Object.keys(pts).length;
function home(){
 cur=-1;
 const L=["ทั้งหมด","ง่าย","กลาง","ยาก"];
 $.innerHTML=`<div class="hero"><div><h1>MathStep</h1><p class="mute">สวัสดี ${esc(user.name)} (${user.cls}) ${esc(user.email)} <button class="link" onclick="login()">เปลี่ยนผู้ใช้</button></p><p class="mute">ฝึกแก้โจทย์คณิตศาสตร์ ม.1–ม.6 ทีละขั้น คิดเองก่อนดูเฉลย</p></div>
 <div class="score">${total()} / ${P.length*3}<small>ทำแล้ว ${done()}/${P.length} ข้อ</small></div></div>
 <div class="tabs">${G.map(g=>`<button class="tab ${g==gr?"on":""}" onclick="gr='${g}';home()">${g}</button>`).join("")}</div><div class="card"><b>บทเรียน ${gr} ตามแนว สสวท.</b><ol>${CH[gr].map(c=>`<li>${c}${P.some(p=>p.gr==gr&&p.tp==c)?"":` <span class="mute">(เร็ว ๆ นี้)</span>`}</li>`).join("")}</ol></div><div class="tabs">${L.map(l=>`<button class="tab ${l==lv?"on":""}" onclick="lv='${l}';home()">${l}</button>`).join("")}</div>
 ${P.map((p,i)=>p.gr==gr&&(lv=="ทั้งหมด"||p.lv==lv)?`<button class="item" onclick="openQ(${i})"><span><b>ข้อ ${P.slice(0,i+1).filter(x=>x.gr==gr).length}</b> ${p.tp} <span class="chip">${p.lv}</span></span>${i in pts?`<span class="done">ทำแล้ว +${pts[i]}</span>`:`<span class="mute">ยังไม่ทำ</span>`}</button>`:"").join("")}
 <p class="mute">บันทึกคะแนนอัตโนมัติในเครื่องนี้ตามอีเมลที่ใช้ · ตอบถูกครั้งแรก 3 คะแนน, ครั้งที่สอง 2 คะแนน, ดูเฉลย 0 คะแนน</p>`;
}
function openQ(i){cur=i;step=1;tries=0;ok=false;S={g:{w:[],r:false},a:{w:[],r:false},m:{w:[],r:false}};
 O={g:shuf(P[i].g),a:shuf(P[i].a),m:shuf(P[i].m)};draw();window.scrollTo(0,0)}
function bar(){const n=["อ่านโจทย์","วางแผน","คำนวณ","ตรวจ","สรุป"];
 return `<div class="bar">${n.map((t,i)=>`<div class="${i+1==step?"on":i+1<step?"past":""}">${i+1}. ${t}</div>`).join("")}</div>`}
function group(k,title){
 return `<h2>${title}</h2>`+O[k].map((o,i)=>`<button class="opt ${S[k].r&&o.ok?"ok":S[k].w.includes(i)?"bad":""}" ${S[k].r?"disabled":""} onclick="pick('${k}',${i})">${o.t}</button>`).join("")+
 (S[k].w.length&&!S[k].r?`<div class="msg bad">ยังไม่ใช่ ลองอ่านโจทย์อีกรอบนะ</div>`:"")+(S[k].r?`<div class="msg ok">ถูกต้อง เก่งมาก</div>`:"")}
function pick(k,i){if(O[k][i].ok)S[k].r=true;else if(!S[k].w.includes(i))S[k].w.push(i);draw()}
function next(){step++;draw();window.scrollTo(0,0)}
function check(){const v=norm(document.getElementById("ans").value);if(!v)return;
 ok=P[cur].ans.map(norm).includes(v);
 if(ok){const g=tries==0?3:2;pts[cur]=Math.max(pts[cur]||0,g);save()}else tries++;step=4;draw()}
// ดูเฉลย: ไม่ลดคะแนนที่เคยได้แล้ว
function reveal(){if(!(cur in pts)){pts[cur]=0;save()}step=5;draw();window.scrollTo(0,0)}
function draw(){
 const p=P[cur];let h=`<button class="link" onclick="home()">← กลับหน้าแรก</button>${bar()}`;
 if(step==1)h+=`<div class="card q">${p.q}</div>`+group("g","โจทย์ให้อะไรมา")+group("a","โจทย์ถามอะไร")+`<button class="go" ${S.g.r&&S.a.r?"":"disabled"} onclick="next()">ไปขั้นวางแผน</button>`;
 if(step==2)h+=`<div class="card q">${p.q}</div>`+group("m","เลือกวิธีคิดที่เหมาะสม")+`<button class="go" ${S.m.r?"":"disabled"} onclick="next()">ไปขั้นคำนวณ</button>`;
 if(step==3)h+=`<div class="card q">${p.q}</div><h2>คำนวณแล้วกรอกคำตอบ</h2><input id="ans" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="พิมพ์คำตอบที่นี่ (เช่น -2, 3/5, 22.5)" onkeydown="if(event.key=='Enter')check()"><button class="go" onclick="check()">ตรวจคำตอบ</button>`;
 if(step==4){
  if(ok)h+=`<div class="msg ok"><b>ถูกต้อง</b> ได้ ${tries==0?3:2} คะแนน ${tries==0?"ตอบถูกตั้งแต่ครั้งแรก":"สำเร็จในครั้งที่สอง"}</div><button class="go" onclick="next()">ดูเฉลยและสรุป</button>`;
  else if(tries<2)h+=`<div class="msg bad">เกือบถูกแล้ว ลองดูคำใบ้นะ</div><div class="msg tip"><b>คำใบ้:</b> ${p.hint}</div><button class="go" onclick="step=3;draw()">ลองคิดใหม่</button><button class="opt" onclick="reveal()">ดูเฉลยเลย (0 คะแนน)</button>`;
  else h+=`<div class="msg bad">ครั้งนี้ยังไม่ถูก ไม่เป็นไร ดูเฉลยแล้วลองข้ออื่นต่อได้</div><button class="go" onclick="reveal()">ดูเฉลย</button>`}
 if(step==5)h+=`<div class="card"><b>เฉลยทีละบรรทัด</b><ol>${p.sol.map(s=>`<li>${s}</li>`).join("")}</ol></div><div class="msg ${pts[cur]?"ok":"tip"}">คะแนนข้อนี้ ${pts[cur]} / 3 · คะแนนรวม ${total()}</div>${cur<P.length-1?`<button class="go" onclick="openQ(${cur+1})">ข้อถัดไป</button>`:""}<button class="opt" onclick="home()">กลับหน้าแรก</button>`;
 $.innerHTML=h;if(step==3)document.getElementById("ans").focus()}
let user=null;
const K=e=>"mathstep:"+e;
function load(e){try{return JSON.parse(localStorage.getItem(K(e))||"{}")}catch(x){return{}}}
function save(){try{localStorage.setItem(K(user.email),JSON.stringify(pts))}catch(x){}}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function login(){cur=-1;
 $.innerHTML=`<h1>MathStep</h1><p class="mute">ฝึกแก้โจทย์คณิตศาสตร์ ม.1–ม.6 ทีละขั้น</p>
 <div class="card"><h2>เริ่มต้นใช้งาน</h2>
 <label for="nm">ชื่อ</label><input id="nm" autocomplete="off" maxlength="40" placeholder="พิมพ์ชื่อของคุณ" value="${user?esc(user.name):""}">
 <label for="em" style="display:block;margin-top:12px">อีเมล (ใช้บันทึกความคืบหน้า)</label><input id="em" type="email" autocomplete="email" maxlength="80" placeholder="name@example.com" value="${user?esc(user.email):""}"><label for="cls" style="display:block;margin-top:12px">ระดับชั้น</label>
 <select id="cls"><option value="">เลือกระดับชั้น</option>${["ม.1","ม.2","ม.3","ม.4","ม.5","ม.6","อื่น ๆ"].map(g=>`<option ${user&&user.cls==g?"selected":""}>${g}</option>`).join("")}</select>
 <div id="err"></div><button class="go" onclick="start()">เริ่มทำโจทย์</button></div>`}
function start(){
 const n=document.getElementById("nm").value.trim(),g=document.getElementById("cls").value,em=document.getElementById("em").value.trim().toLowerCase();
 if(!n||!g||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){document.getElementById("err").innerHTML='<div class="msg bad">กรอกชื่อ อีเมลให้ถูกต้อง และเลือกระดับชั้นก่อนเริ่มนะ</div>';return}
 pts=load(em);
 user={name:n,cls:g,email:em};gr=CH[g]?g:"ม.4";lv="ทั้งหมด";home()}
login();
</script>
</body>
</html>
